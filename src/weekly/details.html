<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TODO: Add meta tags for charset and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TODO: Add a <title> -->
    <title>Week Details</title>

    <!-- TODO: Link to your CSS stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Required: link details.js with defer -->
    <script src="details.js" defer></script>
</head>
<body>

    <!-- TODO: Create a <header> with <h1 id="week-title"> -->
    <header>
        <h1 id="week-title"></h1>
    </header>

    <!-- TODO: Create the <main> content area -->
    <main>
        
        <!-- Section 1: Weekly Information -->
        <article>
            <!-- details.js will set textContent for these IDs -->
            <p id="week-start-date"></p>
            
            <h2>Description & Notes</h2>
            <p id="week-description"></p>
            
            <h2>Exercises & Resources</h2>
            <ul id="week-links-list">
                <!-- details.js will populate <li><a> items here -->
            </ul>
        </article>

        <!-- Section 2: Discussion Forum -->
        <section id="discussion-forum">
            <h2>Discussion</h2>

            <!-- Subsection 2.1: Existing Comments -->
            <div id="comment-list">
                <!-- details.js will inject <article> comments here -->
            </div>

            <!-- Subsection 2.2: Add a Comment Form -->
            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>
                    
                    <label for="new-comment">Your Comment:</label>
                    <textarea id="new-comment" name="comment" required placeholder="Write your thoughts here..."></textarea>
                    
                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>

    </main>

</body>
</html>
